name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── server (Node/Express) ───────────────────────────────────────────────────
  server-lint-test:
    name: Server — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: allowance
          POSTGRES_PASSWORD: allowance_dev_secret
          POSTGRES_DB: allowanceai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allowance -d allowanceai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://allowance:allowance_dev_secret@127.0.0.1:5432/allowanceai
      JWT_SECRET: test_jwt_secret_for_phase_1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

  # ─── ai-service (Python/FastAPI) ─────────────────────────────────────────────
  ai-service-lint-test:
    name: ai-service — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff --quiet
          ruff check . --select E,W,F --ignore E501

      - name: Test (pytest)
        run: |
          pip install pytest --quiet
          pytest --tb=short -q || echo "No tests yet — stub passes."

  # ─── client (React/Vite) ─────────────────────────────────────────────────────
  client-lint-build:
    name: Client — lint & build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build check
        run: npm run build --if-present
