# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: allowanceai-api
    runtime: node
    rootDir: server
    # `npm install` runs postinstall -> prisma generate. Verified: generate needs only
    # DATABASE_URL; `prisma migrate deploy` is the command that requires DIRECT_URL.
    # Migrations are NOT run here: `prisma migrate deploy` is a manual, reviewed step
    # (see DEPLOYMENT.md) so a bad deploy can never silently alter the production DB.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # PostgreSQL (Supabase free tier). Both are set in the Render dashboard —
      # sync:false means Render never reads a value from this file, so no secret
      # ever lands in the repo.
      #   DATABASE_URL -> transaction pooler, :6543, must end with ?pgbouncer=true
      #   DIRECT_URL   -> session pooler, :5432 (Prisma CLI / migrations only)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Legacy v1 MongoDB. OPTIONAL — leave unset and the server skips it and still
      # boots. Auth/budgets/goals/categories/ingestion are all PostgreSQL now.
      - key: MONGO_URI
        sync: false
      # Keep this value stable — regenerating it invalidates every issued JWT and
      # logs every user out.
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      # Shared secret for calling ai-service's /assistant/* endpoints. MUST match
      # INTERNAL_API_TOKEN on allowanceai-ai exactly, so it is set by hand on both
      # services rather than generated here (generateValue would produce two different
      # values and the assistant would 401 forever).
      #
      # Unset is a safe state, not a broken one: /api/assistant/status reports
      # configured:false and the client hides the assistant panel entirely. The
      # dashboard, budgets, goals and ingestion are untouched either way.
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Redis — OPTIONAL, and deliberately not provisioned here. It caches the
      # dashboard summary for 60s. config/redis.js is fail-open: unset or unreachable
      # means every read goes straight to PostgreSQL and the numbers are identical.
      # Never make this required — a dead optional service blocking a working path is
      # exactly what took the live login down.
      - key: REDIS_URL
        sync: false
      # Setu Account Aggregator stays on sandbox. Rules.md: never flip to production
      # without an explicit instruction. Pinned here so a dashboard edit is deliberate.
      - key: SETU_ENV
        value: sandbox

  - type: web
    name: allowanceai-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    # One worker, deliberately. The embedding model is loaded into the process and each
    # worker would hold its own copy, which the free tier's memory ceiling cannot absorb.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      # Phase 4 reads and writes `documents` directly, so ai-service needs the same
      # PostgreSQL as the API. Use the TRANSACTION pooler URL (:6543, ?pgbouncer=true) —
      # this service runs no migrations, so it never needs DIRECT_URL.
      - key: DATABASE_URL
        sync: false
      # Must match INTERNAL_API_TOKEN on allowanceai-api exactly. /assistant/* returns a
      # user's financial history for whatever user_id it is given, so this is the only
      # thing stopping those endpoints being called by anyone who finds the URL.
      #
      # Deliberately has no default and no generateValue. If it is unset, every
      # /assistant/* endpoint answers 503 — it fails CLOSED, never open.
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: ALLOWED_ORIGINS
        value: https://allowance-ai-eight.vercel.app,https://allowanceai-api.onrender.com
