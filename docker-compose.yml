# docker-compose.yml — AllowanceAI v2 local dev stack
# Starts: PostgreSQL (with pgvector), Redis, RabbitMQ
# Services (server, ai-service, client) are run separately via npm/uvicorn — not containerised in dev.

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: allowance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allowance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allowance_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-allowanceai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allowance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: allowance_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: allowance_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-allowance}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-allowance_dev_secret}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
